# This is the YAML file to describe the location of a module

packages:
  - modulename: 'AutoBlog'
    author: 'DoliCloud'
    author_url: 'https://www.dolicloud.com'
    maintener_email: 'contact@dolicloud.com'
    label:
      fr: "AutoBlog"
      en: "AutoBlog"
    description:
      fr: "Générer avec l'IA les articles de blog de vos sites web, depuis une file de sujets traitée par une tâche planifiée, puis les publier après relecture."
      en: "Generate blog articles of your websites with AI, from a queue of topics processed by a scheduled job, then publish them after review."
    status: 'enabled'
    created_at: '2026-11-12'
    last_updated_at: 'auto'
    category: ''
    git: 'https://github.com/DoliCloud/dolimods/tree/master/htdocs/autoblog'
    git-branch: 'master'
    git-system: 'github'
    cover: ''
    current_version: 'auto'
    dolibarrmin: 'auto'
    dolibarrmax: 'auto'
    phpmin: 'auto'
    phpmax: 'auto'
    price: 0
    # direct-download is yes if we can download the module to install it in application
    direct-download: 'no'
    # dolistore-upload is manual if module is also uploaded manually on dolistore.com, auto if sync automatically
    dolistore-upload: 'manual'
    # dolistore-download is url of product page for download if module can also be found on dolistore.com
    dolistore-download: ''
